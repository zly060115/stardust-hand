<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>星尘 · 手 | Hand Nebula</title>
<meta name="description" content="用手势驱动一片星尘星云：握拳塌缩、张手漩涡、响指炸开。摄像头画面全部在本地计算。" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<canvas id="sky"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<div class="hud">
  <div class="brand">
    <div class="orb"></div>
    <div>
      <div class="title">Stardust</div>
      <div class="sub" id="status">初始化…</div>
    </div>
  </div>
</div>

<div class="legend" id="legend">
  <div class="item"><b>张开手掌</b><span>星云旋臂展开，指尖迸出火星</span></div>
  <div class="item"><b>握紧拳头</b><span>星尘向掌心塌缩</span></div>
  <div class="item"><b>拇指食指捏合</b><span>超新星爆发</span></div>
  <div class="item"><b>打响指</b><span>全场星尘轰然炸开</span></div>
  <div class="item"><b>移动手掌</b><span>拖动整片星空</span></div>
</div>

<button id="muteBtn" class="icon-btn" title="音效开关">♪</button>

<div class="perf" id="perf"></div>

<div class="preview" id="preview">
  <video id="cam" playsinline autoplay muted></video>
  <div class="tag">CAM</div>
</div>

<div class="toast" id="toast"></div>

<div class="veil" id="veil">
  <div class="card">
    <div class="glyph">✧</div>
    <h1>把星空握在手里</h1>
    <p>打开摄像头，让手掌成为引力中心。<br>所有画面都在你的设备上实时计算，不会上传任何一帧。</p>
    <button id="startBtn">开启星空</button>
    <button id="demoBtn" class="ghost">没有摄像头？先看看效果</button>
    <div class="hint" id="veilHint">需要摄像头（会一并申请麦克风，用来听响指）</div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
